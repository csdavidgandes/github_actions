[project]
name = "mi-proyecto"
version = "0.1.0"
description = "Proyecto de ejemplo para Modulo 7 - GitHub Actions"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
